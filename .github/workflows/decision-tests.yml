name: Decision CPU tests
on:
  push:
    branches: [main, 'feat/v2-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies remotely
        run: python -m pip install -e '.[dev,tracking,tokenizer]'
      - name: Check dependencies
        run: python -m pip check
      - name: Numerical and control-plane regression tests
        run: python -m pytest --junitxml=/tmp/decision-tests.xml
